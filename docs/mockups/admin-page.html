<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nyxify admin page mockup</title>
<!--
	The settings page as the plugin renders it: the plugin's own classes ran with sample data (no real store, key or
	PIN), and its stylesheet and script are copied in below. Only the WordPress admin around the page is imitated.
	Regenerate it after changing the page instead of editing it by hand.
-->
<style>
/* ---- Mockup only: the state switcher and an imitation of the WordPress admin around the page ---- */
* { box-sizing: border-box; }
body {
	margin: 0;
	background: #f0f0f1;
	color: #1d2327;
	font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
}
body.rtl { font-family: Tahoma, Arial, sans-serif; }
.mock-switcher {
	position: sticky; inset-block-start: 0; z-index: 10;
	display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
	padding: 8px 16px; background: #fffbe6; border-block-end: 1px solid #e6c200; font-size: 12px;
}
.mock-switcher span { display: flex; flex-wrap: wrap; gap: 6px; }
.mock-switcher button { font: inherit; padding: 3px 10px; border: 1px solid #c3c4c7; border-radius: 3px; background: #fff; cursor: pointer; }
.mock-switcher button[aria-pressed="true"] { background: #1d2327; color: #fff; border-color: #1d2327; }
.wp-adminbar { block-size: 32px; background: #1d2327; }
.wp-shell { display: flex; min-block-size: calc(100vh - 32px); }
.wp-menu { flex: 0 0 160px; background: #1d2327; padding-block: 12px; font-size: 14px; }
.wp-menu div { padding: 6px 12px; color: #c3c4c7; }
.wp-menu .open { background: #2c3338; color: #fff; }
.wp-menu .sub { padding-inline-start: 24px; font-size: 13px; }
.wp-menu .current { color: #fff; font-weight: 600; }
.wp-content { flex: 1; min-inline-size: 0; padding: 0 20px 40px; }
@media (max-width: 782px) {
	.wp-menu { display: none; }
	.wp-content { padding-inline: 10px; }
}

/* The parts of WordPress' own admin styles the page uses */
.wrap { margin-block: 10px 0; margin-inline: 2px 20px; }
@media (max-width: 782px) { .wrap { margin-inline: 0; } }
a { color: #2271b1; }
p { font-size: 13px; line-height: 1.5; margin: 1em 0; }
h1 { font-size: 23px; font-weight: 400; margin: 0; padding: 9px 0 4px; line-height: 1.3; }
h2 { font-size: 1.3em; margin: 1em 0; }
code { padding: 3px 5px 2px; margin: 0 1px; background: rgba(0, 0, 0, .07); font-size: 13px; font-family: Consolas, Monaco, monospace; }
.description, p.description { color: #646970; }
p.description { margin: 2px 0 5px; }
.wp-header-end { visibility: hidden; margin: -2px 0 0; border: 0; }
.screen-reader-text { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip: rect(1px, 1px, 1px, 1px); white-space: nowrap; }
.js .hide-if-js, .no-js .hide-if-no-js { display: none; }
label { cursor: pointer; }
input[type="text"], input[type="password"] {
	padding: 0 8px; line-height: 2; min-block-size: 30px; border: 1px solid #8c8f94; border-radius: 4px;
	background: #fff; color: #2c3338; font-size: 14px; font-family: inherit;
}
input.code { font-family: Consolas, Monaco, monospace; }
.button {
	display: inline-block; box-sizing: border-box; margin: 0; padding: 0 10px; min-block-size: 30px;
	border: 1px solid #2271b1; border-radius: 3px; background: #f6f7f7; color: #2271b1;
	font-size: 13px; line-height: 2.15384615; text-decoration: none; white-space: nowrap; vertical-align: top; cursor: pointer;
	font-family: inherit;
}
.button:hover { background: #f0f0f1; border-color: #0a4b78; color: #0a4b78; }
.button-primary { background: #2271b1; border-color: #2271b1; color: #fff; }
.button-primary:hover { background: #135e96; border-color: #135e96; color: #fff; }
.button-small { min-block-size: 26px; padding: 0 8px; font-size: 11px; line-height: 2.18181818; }
.button-link {
	margin: 0; padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none;
	color: #2271b1; font: inherit; text-align: start; text-decoration: underline; cursor: pointer;
}
.button-link-delete { color: #d63638; }
.notice {
	margin: 5px 0 15px; padding: 1px 12px; background: #fff; border: 1px solid #c3c4c7; border-inline-start-width: 4px;
	box-shadow: 0 1px 1px rgba(0, 0, 0, .04);
}
.notice p { margin: .5em 0; padding: 2px; }
.notice-success { border-inline-start-color: #00a32a; }
.notice-error { border-inline-start-color: #d63638; }
.notice-warning { border-inline-start-color: #dba617; }
.notice-info { border-inline-start-color: #72aee6; }
</style>
<style>
/* ---- assets/css/admin.css ---- */
/**
 * Nyxify settings page. Logical properties only, so the same rules work in RTL (e.g. Persian) and LTR admins. The
 * WordPress admin's own buttons, notices and fields are kept; Nyxify adds cards, badges and one accent colour. The
 * icons are our own SVGs, drawn as masks in the text's colour.
 */

.nyxify-settings {
	--nyxify-accent: #5b3cc4;
	--nyxify-accent-dark: #4527a0;
	--nyxify-accent-soft: #f1edfc;
	--nyxify-border: #dcdcde;
	--nyxify-muted: #646970;
	--nyxify-soft: #f6f7f7;
	--nyxify-ok: #00701a;
	--nyxify-ok-soft: #edfaef;
	--nyxify-warning: #8a5a00;
	--nyxify-warning-soft: #fcf9e8;
	--nyxify-error: #b32d2e;
	--nyxify-error-soft: #fcf0f1;
	--nyxify-info: #135e96;
	--nyxify-info-soft: #f0f6fc;
	max-inline-size: 1200px;
}

.nyxify-settings code[dir="ltr"],
.nyxify-settings input[dir="ltr"] {
	unicode-bidi: isolate;
}

.nyxify-settings code[dir="ltr"] {
	display: inline-block;
	max-inline-size: 100%;
	overflow-wrap: anywhere;
}

.nyxify-settings input[dir="ltr"] {
	text-align: start;
}

.nyxify-settings .nyxify-header h1 {
	margin: 0;
	padding: 0;
	font-size: 20px;
	font-weight: 600;
	line-height: 1.3;
}

.nyxify-header__title {
	flex: 1 1 12em;
	min-inline-size: 0;
}

.nyxify-header p {
	margin: 0;
	color: var(--nyxify-muted);
}

.nyxify-header__end {
	margin-inline-start: auto;
}

/* Badges */

.nyxify-pill {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	padding: 4px 10px;
	border-radius: 999px;
	font-size: 12px;
	font-weight: 600;
	line-height: 1.4;
	white-space: nowrap;
}

.nyxify-pill::before {
	content: "";
	inline-size: 7px;
	block-size: 7px;
	border-radius: 50%;
	background: currentColor;
}

.nyxify-pill--ok {
	background: var(--nyxify-ok-soft);
	color: var(--nyxify-ok);
}

.nyxify-pill--warning {
	background: var(--nyxify-warning-soft);
	color: var(--nyxify-warning);
}

.nyxify-pill--error {
	background: var(--nyxify-error-soft);
	color: var(--nyxify-error);
}

.nyxify-pill--info {
	background: var(--nyxify-info-soft);
	color: var(--nyxify-info);
}

.nyxify-pill--off {
	background: var(--nyxify-soft);
	color: var(--nyxify-muted);
}

.nyxify-pill--busy::before {
	animation: nyxify-pulse 1.2s ease-in-out infinite;
}

@keyframes nyxify-pulse {

	50% {
		opacity: 0.25;
	}
}

@media (prefers-reduced-motion: reduce) {

	.nyxify-pill--busy::before {
		animation: none;
	}
}

/* Icons */

.nyxify-icon {
	display: inline-block;
	flex: none;
	inline-size: 18px;
	block-size: 18px;
	background-color: currentColor;
	-webkit-mask: no-repeat center / contain;
	mask: no-repeat center / contain;
}

.button .nyxify-icon {
	inline-size: 14px;
	block-size: 14px;
	margin-inline-end: 4px;
	vertical-align: text-bottom;
}

/* Cards and layout */

.nyxify-overview {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
	gap: 16px;
	margin-block-start: 20px;
}

.nyxify-layout {
	display: grid;
	grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
	align-items: start;
	gap: 16px;
	margin-block-start: 16px;
}

.nyxify-layout__main,
.nyxify-layout__side {
	display: grid;
	gap: 16px;
	min-inline-size: 0;
}

@media (max-width: 1100px) {

	.nyxify-layout {
		grid-template-columns: minmax(0, 1fr);
	}
}

.nyxify-card {
	min-inline-size: 0;
	padding: 16px 20px;
	background: #fff;
	border: 1px solid var(--nyxify-border);
	border-radius: 8px;
	box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
}

.nyxify-setup {
	margin-block-start: 20px;
}

.nyxify-card__head {
	display: flex;
	align-items: center;
	gap: 8px;
	margin-block-end: 12px;
}

.nyxify-settings .nyxify-card__head h2 {
	margin: 0;
	font-size: 14px;
	font-weight: 600;
}

.nyxify-card__head .nyxify-icon,
.nyxify-stat__label .nyxify-icon {
	color: var(--nyxify-accent);
}

.nyxify-card .notice.inline {
	margin: 12px 0;
}

.nyxify-empty {
	margin: 0;
	padding: 16px;
	border: 1px dashed var(--nyxify-border);
	border-radius: 8px;
	color: var(--nyxify-muted);
	text-align: center;
}

/* Overview */

.nyxify-stat__label {
	display: flex;
	align-items: center;
	gap: 6px;
}

.nyxify-settings .nyxify-stat__label h2 {
	margin: 0;
	color: var(--nyxify-muted);
	font-size: 12px;
	font-weight: 600;
	letter-spacing: 0.03em;
	text-transform: uppercase;
}

.rtl .nyxify-settings .nyxify-stat__label h2 {
	letter-spacing: 0;
	text-transform: none;
}

.nyxify-stat__value {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 8px;
	margin: 6px 0 2px;
	font-size: 20px;
	font-weight: 600;
	line-height: 1.4;
}

.nyxify-settings .nyxify-stat__meta {
	margin: 2px 0;
	color: var(--nyxify-muted);
}

.nyxify-settings .nyxify-stat__meta--warning {
	color: var(--nyxify-warning);
	font-weight: 600;
}

.nyxify-settings .nyxify-stat__meta--error {
	color: var(--nyxify-error);
}

.nyxify-bar {
	block-size: 6px;
	margin: 10px 0 6px;
	overflow: hidden;
	border-radius: 3px;
	background: #e7e7ea;
}

.nyxify-bar > span {
	display: block;
	block-size: 100%;
	border-radius: inherit;
	background: var(--nyxify-accent);
}

.nyxify-bar--full > span {
	background: #dba617;
}

.nyxify-sync-form {
	margin-block-start: 10px;
}

/* Forms */

.nyxify-field label {
	display: block;
	margin-block-end: 6px;
	font-weight: 600;
}

.nyxify-field input.code {
	inline-size: 100%;
	max-inline-size: 30em;
}

.nyxify-inline {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 8px;
}

.nyxify-settings .nyxify-inline input.code {
	flex: 1 1 18em;
	margin: 0;
}

.nyxify-actions {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 8px 16px;
	margin-block-start: 12px;
}

.nyxify-actions form,
.nyxify-actions p {
	margin: 0;
}

.nyxify-settings details > summary {
	cursor: pointer;
	color: #2271b1;
}

.nyxify-settings details[open] > summary {
	margin-block-end: 8px;
}

/* Setup */

.nyxify-steps {
	display: grid;
	grid-template-columns: repeat(3, minmax(0, 1fr));
	gap: 12px;
	margin: 16px 0;
	padding: 0;
	list-style: none;
	counter-reset: nyxify-step;
}

@media (max-width: 782px) {

	.nyxify-steps {
		grid-template-columns: minmax(0, 1fr);
	}
}

.nyxify-steps li {
	display: flex;
	align-items: flex-start;
	gap: 10px;
	margin: 0;
	padding: 12px;
	border-radius: 8px;
	background: var(--nyxify-soft);
	color: var(--nyxify-muted);
	counter-increment: nyxify-step;
}

.nyxify-steps li::before {
	content: counter(nyxify-step);
	display: grid;
	flex: 0 0 26px;
	place-items: center;
	inline-size: 26px;
	block-size: 26px;
	border: 1px solid var(--nyxify-border);
	border-radius: 50%;
	background: #fff;
	font-weight: 700;
}

.locale-fa-ir .nyxify-steps li::before {
	content: counter(nyxify-step, persian);
}

.nyxify-steps li[aria-current="step"] {
	background: var(--nyxify-accent-soft);
	color: #1d2327;
}

.nyxify-steps li[aria-current="step"]::before {
	border-color: var(--nyxify-accent);
	background: var(--nyxify-accent);
	color: #fff;
}

.nyxify-steps strong {
	display: block;
	color: #1d2327;
}

.nyxify-privacy {
	display: flex;
	align-items: flex-start;
	gap: 8px;
	margin: 16px 0 0;
	color: var(--nyxify-muted);
}

.nyxify-privacy .nyxify-icon {
	color: var(--nyxify-ok);
}

/* Bots */

.nyxify-bots {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
	gap: 12px;
	margin-block-start: 12px;
}

.nyxify-bot {
	display: flex;
	flex-direction: column;
	gap: 8px;
	min-inline-size: 0;
	padding: 14px;
	border: 1px solid var(--nyxify-border);
	border-radius: 8px;
}

.nyxify-bot--empty {
	background: var(--nyxify-soft);
}

.nyxify-bot__head {
	display: flex;
	align-items: center;
	gap: 10px;
}

.nyxify-bot__avatar {
	display: grid;
	flex: 0 0 32px;
	place-items: center;
	inline-size: 32px;
	block-size: 32px;
	border-radius: 50%;
	background: var(--nyxify-accent-soft);
	color: var(--nyxify-accent);
	font-weight: 700;
}

.nyxify-settings .nyxify-bot__head h3 {
	margin: 0;
	font-size: 14px;
}

.nyxify-bot__head .nyxify-pill {
	margin-inline-start: auto;
}

.nyxify-bot .nyxify-actions {
	margin-block-start: auto;
	padding-block-start: 4px;
}

.nyxify-bot .nyxify-field p {
	margin-block: 6px 0;
}

.nyxify-details {
	display: grid;
	grid-template-columns: auto 1fr;
	gap: 4px 12px;
	margin: 0;
}

.nyxify-details dt {
	color: var(--nyxify-muted);
}

.nyxify-details dd {
	min-inline-size: 0;
	margin: 0;
	overflow-wrap: anywhere;
}

.nyxify-callout {
	margin: 0;
	padding: 8px 10px;
	border-radius: 6px;
}

.nyxify-callout p {
	margin: 0.2em 0;
}

.nyxify-callout--error {
	background: var(--nyxify-error-soft);
	color: #8a2424;
}

.nyxify-callout--warning {
	background: var(--nyxify-warning-soft);
	color: #6b4700;
}

.nyxify-callout--info {
	background: var(--nyxify-info-soft);
	color: #0a4b78;
}

/* Admin PIN */

.nyxify-pin {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 10px;
	margin: 4px 0 8px;
}

.nyxify-settings .nyxify-pin__value {
	padding: 10px 14px;
	border: 1px dashed #c3c4c7;
	border-radius: 8px;
	background: var(--nyxify-soft);
	font-size: 26px;
	font-weight: 600;
	letter-spacing: 0.2em;
	line-height: 1;
}

.nyxify-pin__status {
	color: var(--nyxify-ok);
	font-weight: 600;
}

/* Bot admins */

.nyxify-table {
	inline-size: 100%;
	margin-block-start: 8px;
	border-collapse: collapse;
}

.nyxify-table th,
.nyxify-table td {
	padding: 8px 10px;
	border-block-end: 1px solid #f0f0f1;
	text-align: start;
	vertical-align: middle;
}

.nyxify-table th {
	color: var(--nyxify-muted);
	font-size: 12px;
	font-weight: 600;
}

.nyxify-table td:last-child {
	text-align: end;
}

.nyxify-table tbody tr:hover {
	background: #fafafa;
}

.nyxify-admin-remove-form {
	margin: 0;
}

.nyxify-tag {
	display: inline-block;
	padding: 1px 8px;
	border-radius: 999px;
	background: var(--nyxify-accent-soft);
	color: var(--nyxify-accent-dark);
	font-size: 12px;
}

/* Connection */

.nyxify-folds {
	margin-block-start: 14px;
}

.nyxify-folds details {
	padding-block: 10px;
	border-block-start: 1px solid #f0f0f1;
}

.nyxify-folds summary {
	font-weight: 600;
}

/* Deactivation note */

.nyxify-footer-note {
	display: flex;
	align-items: flex-start;
	gap: 10px;
	margin-block-start: 16px;
	padding: 12px 16px;
	border: 1px solid var(--nyxify-border);
	border-radius: 8px;
	background: #fff;
	color: var(--nyxify-muted);
}

.nyxify-footer-note .nyxify-icon {
	margin-block-start: 2px;
	color: #dba617;
}

.nyxify-footer-note p {
	margin: 0 0 4px;
}

.nyxify-footer-note strong {
	color: #1d2327;
}

<script type="text/plain" id="nyxify-admin-js">
/* ---- assets/js/admin.js ---- */
/**
 * Nyxify settings page: asks for confirmation before a form with a `data-nyxify-confirm` message is submitted, and
 * shows, hides and copies the admin PIN (in this browser only; nothing is sent).
 *
 * @package Nyxify
 */

( function () {
	'use strict';

	var MASK = '••••••';

	document.addEventListener( 'submit', function ( event ) {
		var form = event.target;
		if ( ! ( form instanceof HTMLFormElement ) ) {
			return;
		}

		var message = form.getAttribute( 'data-nyxify-confirm' );
		if ( message && ! window.confirm( message ) ) {
			event.preventDefault();
		}
	} );

	/**
	 * Copies text with the Clipboard API, or with a hidden field where it isn't available (no HTTPS).
	 *
	 * @param {string} text The text.
	 * @return {Promise} Settled once copied, rejected when the browser refused.
	 */
	function copy( text ) {
		if ( navigator.clipboard && window.isSecureContext ) {
			return navigator.clipboard.writeText( text );
		}

		return new Promise( function ( resolve, reject ) {
			var field = document.createElement( 'textarea' );
			field.value = text;
			field.setAttribute( 'readonly', '' );
			field.style.position = 'fixed';
			field.style.opacity = '0';
			document.body.appendChild( field );
			field.select();
			var copied = false;
			try {
				copied = document.execCommand( 'copy' );
			} catch ( e ) {
				copied = false;
			}
			document.body.removeChild( field );
			if ( copied ) {
				resolve();
			} else {
				reject();
			}
		} );
	}

	/**
	 * Wires the PIN's "Show" and "Copy" buttons.
	 *
	 * @param {HTMLElement} box The PIN's box (`data-nyxify-pin`).
	 */
	function setUpPin( box ) {
		var secret = document.querySelector( '[data-nyxify-pin-secret]' );
		var value = box.querySelector( '[data-nyxify-pin-value]' );
		var toggle = box.querySelector( '[data-nyxify-pin-toggle]' );
		var copyButton = box.querySelector( '[data-nyxify-pin-copy]' );
		var status = box.querySelector( '[role="status"]' );
		if ( ! secret || ! value || ! toggle || ! copyButton || ! status ) {
			return;
		}

		var hiddenLabel = value.getAttribute( 'aria-label' );

		toggle.addEventListener( 'click', function () {
			var shown = 'true' === toggle.getAttribute( 'aria-pressed' );
			value.textContent = shown ? MASK : secret.textContent;
			if ( shown ) {
				value.setAttribute( 'aria-label', hiddenLabel );
			} else {
				value.removeAttribute( 'aria-label' );
			}
			toggle.setAttribute( 'aria-pressed', shown ? 'false' : 'true' );
			toggle.textContent = box.getAttribute( shown ? 'data-nyxify-show' : 'data-nyxify-hide' );
		} );

		copyButton.addEventListener( 'click', function () {
			status.textContent = '';
			copy( secret.textContent ).then(
				function () {
					status.textContent = box.getAttribute( 'data-nyxify-copied' );
				},
				function () {
					if ( 'true' !== toggle.getAttribute( 'aria-pressed' ) ) {
						toggle.click();
					}
					status.textContent = box.getAttribute( 'data-nyxify-copy-failed' );
				}
			);
		} );
	}

	document.querySelectorAll( '[data-nyxify-pin]' ).forEach( setUpPin );
}() );
</script>
<script>
/*
 * Shows one state in one language (#active-fa in the address opens that one). admin.js runs again for each state,
 * so the PIN's buttons work; only its first run adds the page-wide confirmation on submit. Forms post nowhere.
 */
( function () {
	var adminJs = document.getElementById( 'nyxify-admin-js' ).textContent;
	var addListener = document.addEventListener;
	var started = false;
	var parts = location.hash.slice( 1 ).split( /-(?=en$|fa$)/ );
	var state = document.getElementById( parts[0] + '-en' ) ? parts[0] : 'active';
	var lang = 'fa' === parts[1] ? 'fa' : 'en';

	function runAdminJs() {
		if ( started ) {
			document.addEventListener = function ( type ) {
				if ( 'submit' !== type ) {
					addListener.apply( document, arguments );
				}
			};
		}
		new Function( adminJs )();
		document.addEventListener = addListener;
		started = true;
	}

	function show() {
		var page = document.getElementById( 'page' );
		var rtl = 'fa' === lang;
		document.documentElement.lang = lang;
		document.documentElement.dir = rtl ? 'rtl' : 'ltr';
		document.body.classList.toggle( 'rtl', rtl );
		document.body.classList.toggle( 'locale-fa-ir', rtl );
		document.body.classList.toggle( 'locale-en-us', ! rtl );
		page.replaceChildren( document.getElementById( state + '-' + lang ).content.cloneNode( true ) );
		document.querySelectorAll( '.wp-menu [data-en]' ).forEach( function ( item ) {
			item.textContent = item.getAttribute( 'data-' + lang );
		} );
		document.querySelectorAll( '[data-lang]' ).forEach( function ( button ) {
			button.setAttribute( 'aria-pressed', String( button.dataset.lang === lang ) );
		} );
		document.querySelectorAll( '[data-state]' ).forEach( function ( button ) {
			button.setAttribute( 'aria-pressed', String( button.dataset.state === state ) );
		} );
		try {
			history.replaceState( null, '', '#' + state + '-' + lang );
		} catch ( e ) {}
		runAdminJs();
	}

	document.querySelectorAll( '[data-lang]' ).forEach( function ( button ) {
		button.onclick = function () {
			lang = button.dataset.lang;
			show();
		};
	} );
	document.querySelectorAll( '[data-state]' ).forEach( function ( button ) {
		button.onclick = function () {
			state = button.dataset.state;
			show();
		};
	} );
	document.addEventListener( 'submit', function ( event ) {
		event.preventDefault();
	} );
	show();
}() );
</script>
